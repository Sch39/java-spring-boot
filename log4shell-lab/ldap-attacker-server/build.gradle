plugins {
    id 'java'
    id 'application'
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.unboundid:unboundid-ldapsdk:6.0.11'
}

application {
    mainClass = 'dev.sch39.attacker.AttackerLdapServer'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}