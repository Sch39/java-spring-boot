syntax = "proto3";

package dev.sch39.movies_review_service.grpc;

option java_multiple_files = true;
option java_package = "dev.sch39.movies_review_service.grpc";

service ReviewService {
  rpc AddReview(AddReviewRequest) returns (ReviewReply);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsReply);
}

message AddReviewRequest {
  int64 movie_info_id = 1;
  string comment = 2;
  double rating = 3;
}

message ListReviewsRequest {
  int64 movie_info_id = 1;
}

message ReviewReply {
  string review_id = 1;
  int64 movie_info_id = 2;
  string comment = 3;
  double rating = 4;
}

message ListReviewsReply {
  repeated ReviewReply reviews = 1;
}